services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    restart: unless-stopped
    command: ["server", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      - OPENCODE_HEADLESS_SERVER=true
      - OPENCODE_CONFIG=/app/config/opencode.json
    volumes:
      - ${DOCKER_DATA_PATH}/data:/data
      - ${DOCKER_DATA_PATH}/config:/app/config

volumes:
  opencode_data:
