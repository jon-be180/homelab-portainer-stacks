services:
  opencode:
    image: ghcr.io/anomalyco/opencode:2.4.1
    container_name: opencode
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "3000"]
    expose:
      - "3000"
    environment:
      - OPENCODE_HEADLESS_SERVER=true
      - OPENCODE_CONFIG=/app/config/opencode.json
      - XDG_DATA_HOME=/data/.opencode
      - OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","share":"auto"}'
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-pass}
    volumes:
      - ${DOCKER_DATA_PATH}/opencode/data:/data
      - ${DOCKER_DATA_PATH}/opencode/config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.docker.stack.name=opencode"
      - "maintainer=homelab"

  opencode-proxy:
    image: nginx:alpine
    container_name: opencode-proxy
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - OPENCODE_PASSWORD=${OPENCODE_PASSWORD:-pass}
    volumes:
      - ./nginx.conf.template:/etc/nginx/opencode.conf.template:ro
      - ./render-nginx-config.sh:/docker-entrypoint.d/15-render-opencode-config.sh:ro
    depends_on:
      - opencode
    labels:
      - "com.docker.stack.name=opencode"
      - "maintainer=homelab"
