services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode
    restart: unless-stopped
    command: ["serve", "--hostname", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    environment:
      - OPENCODE_HEADLESS_SERVER=true
      - OPENCODE_CONFIG=/app/config/opencode.json
      - XDG_DATA_HOME=/data/.opencode
      - OPENCODE_CONFIG_CONTENT='{"$schema":"https://opencode.ai/config.json","share":"auto"}'
    volumes:
      - ${DOCKER_DATA_PATH}/opencode/data:/data
      - ${DOCKER_DATA_PATH}/opencode/config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "com.docker.stack.name=opencode"
      - "maintainer=homelab"

  llamacpp-fast:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llamacpp-fast
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: >
      --model /models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
      --alias qwen-fast
      --host 0.0.0.0
      --port 8080
      --threads 8
      --ctx-size 16384
      --flash-attn
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.docker.stack.name=opencode"
      - "maintainer=homelab"
