version: '3.8'

services:
  jellyfin_server:
    container_name: jellyfin
    build: .
    image: jellyfin-rffmpeg:latest
    volumes:
      - ${DOCKER_DATA_PATH}/jellyfin/config:/config
      - ${DOCKER_DATA_PATH}/jellyfin/cache:/cache
      - ${SHOWS_PATH}:/shows
      - ${MOVIES_PATH}:/movies
      # Shared transcode directory on E: drive
      - E:\jellyfin_transcode:/transcode
      # SSH key for passwordless authentication to Windows host
      - ${DOCKER_DATA_PATH}/jellyfin/jellyfin_id_ed25519:/root/.ssh/id_ed25519:ro
      # Local rffmpeg configuration
      - ${DOCKER_DATA_PATH}/jellyfin/rffmpeg.yml:/etc/rffmpeg/rffmpeg.yml:ro
environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Guatemala
      - JELLYFIN_PublishedServerUrl=${SERVER_IP}
    restart: unless-stopped
    networks:
      - jellyfin-net
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    devices:
      - /dev/dxg:/dev/dxg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8096 || exit 1"]
      interval: 300s
      timeout: 5s
      retries: 5
      start_period: 60s
      
networks:
  jellyfin-net:
    driver: bridge
