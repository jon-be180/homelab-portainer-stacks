version: '3.8'

services:
  jellyfin_server:
    container_name: jellyfin
    build:
      context: .
      dockerfile: Dockerfile    
    volumes:
      - ${DOCKER_DATA_PATH}/jellyfin/config:/config
      - ${DOCKER_DATA_PATH}/jellyfin/cache:/cache
      - ${SHOWS_PATH}:/shows
      - ${MOVIES_PATH}:/movies
      - E:/jellyfin_transcode:/transcode
      - ${DOCKER_DATA_PATH}/jellyfin/jellyfin_id_ed25519:/config/.ssh/id_ed25519:ro
      - ${DOCKER_DATA_PATH}/jellyfin/rffmpeg.yml:/etc/rffmpeg/rffmpeg.yml:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Guatemala
      - JELLYFIN_PublishedServerUrl=${SERVER_IP}
    restart: unless-stopped
    networks:
      - jellyfin-net
    ports:
      - 8096:8096
      - 8920:8920
      - 7359:7359/udp
      - 1900:1900/udp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
      
networks:
  jellyfin-net:
    driver: bridge
