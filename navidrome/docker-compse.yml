services:
  navidrome_server:
    image: deluan/navidrome:latest
    pull_policy: always
    container_name: navidrome
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "@every 1h"
      ND_LOGLEVEL: info
      ND_BASEURL: ${ND_BASEURL:-http://media.cougar-lake.ts.net:4533}
    volumes:
      - ${DOCKER_DATA_PATH}/navidrome/data:/data
      - ${DOCKER_MUUSIC_PATH}:/music:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4533/ping || exit 1"]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 10s
