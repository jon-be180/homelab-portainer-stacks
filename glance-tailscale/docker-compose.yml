services:
  glance_tailscale_server:
    image: glanceapp/glance:latest
    pull_policy: always
    container_name: glance_tailscale_server
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - TZ=America/Guatemala
    volumes:
      - ${GLANCE_STORAGE_PATH}/assets:/etc/glance/assets
    configs:
      - source: glance_config
        target: /app/config/glance.yml
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 15s

configs:
  glance_config:
    file: ./glance.yml
